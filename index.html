<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8f1e8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="かずちゃんの冷蔵庫">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css"><script src="app.js" defer></script><title>かずちゃんの冷蔵庫</title>
</head>
<body>
<main>
<header><p class="eyebrow">毎日のごはんを、気持ちよく。</p><h1>かずちゃんの冷蔵庫</h1><p>あるものを見つけて、おいしく使い切ろう。</p></header>
<div id="notice" role="status" aria-live="polite"></div>
<section class="summary" aria-label="在庫の概要"><div><strong id="total">0</strong><span>登録した食材</span></div><div><strong id="soon">0</strong><span>期限まであと3日以内</span></div></section>
<section class="panel"><div class="section-head"><h2 id="form-title">食材を登録</h2><span class="subtle">＊は必須</span></div>
<form id="food-form">
<label>食材名 ＊<input id="name" required maxlength="80" placeholder="例：卵、にんじん" autocomplete="off"></label>
<div class="row"><label>数量 ＊<input id="quantity" type="number" min="0" step="any" required inputmode="decimal" placeholder="例：3"></label><label>単位 ＊<input id="unit" list="units" required maxlength="20" placeholder="例：個" value="個"><datalist id="units"><option value="個"><option value="本"><option value="g"><option value="ml"><option value="枚"><option value="袋"><option value="パック"></datalist></label></div>
<label>保存場所<select id="storage"><option value="fridge">冷蔵</option><option value="freezer">冷凍</option><option value="pantry">常温</option></select></label>
<div class="row"><label>期限の種類<select id="expiry-type"><option value="best">賞味期限</option><option value="use">消費期限</option></select></label><label>期限の日付<input id="expiry" type="date"></label></div>
<p class="hint">期限は空欄でも登録できます。</p><div class="row"><button type="submit" id="submit">食材を登録する</button><button type="button" class="secondary" id="cancel" hidden>編集をやめる</button></div>
</form></section>
<section class="inventory"><div class="section-head"><h2>食材一覧</h2><span id="count" class="subtle"></span></div><label class="search-label">食材を探す<input id="search" type="search" placeholder="食材名で検索"></label>
<div class="filters" role="group" aria-label="保存場所で絞り込む"><button type="button" data-filter="all" aria-pressed="true">すべて</button><button type="button" data-filter="fridge" aria-pressed="false">冷蔵</button><button type="button" data-filter="freezer" aria-pressed="false">冷凍</button><button type="button" data-filter="pantry" aria-pressed="false">常温</button></div>
<p class="hint">期限が近い食材から表示します。期限は食べられるかどうかの判断を保証するものではありません。</p><div id="food-list"></div></section>
<section class="panel backup"><h2>データを大切に保存</h2><p>この端末のブラウザーに保存します。別の端末とは共有されません。ブラウザーのデータを消すと在庫も消えるため、ときどきバックアップしてください。</p><div class="row"><button id="export" class="secondary" type="button">バックアップ保存</button><label class="import-button">バックアップを戻す<input id="import" type="file" accept="application/json,.json"></label></div></section>
<footer>かずちゃんの冷蔵庫 · 第1段階<br>あなたの暮らしに、小さなゆとりを。</footer>
</main>
<dialog id="use-dialog"><form id="use-form"><h2>食材を使う</h2><p id="use-description"></p><label>使った数量<input id="use-quantity" type="number" min="0" step="any" required inputmode="decimal"></label><p class="hint">残りが0になっても食材は一覧に残ります。</p><div class="row"><button type="submit">数量を減らす</button><button type="button" class="secondary" id="use-cancel">やめる</button></div></form></dialog>
</body></html>
